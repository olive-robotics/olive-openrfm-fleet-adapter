# FLEET CONFIG =================================================================
# RMF Fleet parameters
rmf_fleet:
  name: "olive"
  
  limits:
    linear: [0.3, 0.3] # max velocity m/s, max acceleration m/s^2
    angular: [0.7, 1.0] # max angular velocity rad/s, max acceleration rad/s^2

  profile: # Robot profile is modelled as a circle
    footprint: 0.6 # radius in m
    vicinity: 0.03 # radius in m
  
  reversible: False # whether robots in this fleet can reverse
  battery_system:
    voltage: 25.0 # V
    capacity: 40.0 # Ahr
    charging_current: 10.0 # A
  mechanical_system:
    mass: 20.0 # kg
    moment_of_inertia: 20.0 #kgm^2
    friction_coefficient: 0.20
  ambient_system:
    power: 20.0 # W
  tool_system:
    power: 0.0 # W
  recharge_threshold: 0.20 # Battery level below which robots in this fleet will not operate
  recharge_soc: 1.0 # Battery level to which robots in this fleet should be charged up to during recharging tasks
  publish_fleet_state: True
  account_for_battery_drain: False
  task_capabilities: # Specify the types of RMF Tasks that robots in this fleet are capable of performing
    loop: True
    delivery: False
    clean: False
    finishing_request: "nothing" # [park, charge, nothing]

  fleet_manager:
      prefix: "http://192.168.100.12:8000"
      user: ""
      password: ""

# DeliveryBot CONFIG =================================================================

robots:
  # Here the user is expected to append the configuration for each robot in the
  # fleet.
  # Configuration for first robot in this fleet
  olive_001:
    robot_config:
      max_delay: 10.0 # allowed seconds of delay of the current itinerary before it gets interrupted and replanned
    rmf_config:
      robot_state_update_frequency: 10.0
      start:
        map_name: "Level1"
        # waypoint: "charger_deliverybot1" # Optional
        # orientation: 0.0 # Optional, radians
        waypoint: "Start"
        orientation: 4.0
      charger:
        waypoint: "Charger"
        
  # Configuration for the second robot in this fleet if there is a second robot
  # Uncomment if more than one robot exists.
  # deliverybot2:
  #   robot_config:
  #     max_delay: 10.0 # allowed seconds of delay of the current itinerary before it gets interrupted and replanned
  #   rmf_config:
  #     robot_state_update_frequency: 0.5
  #     start:
  #       map_name: "L1"
  #       # waypoint: "charger_deliverybot2" # Optional
  #       # orientation: 0.0 # Optional, radians
  #       waypoint: null
  #       orientation: null
  #     charger:
  #       waypoint: "charger_deliverybot2"

# TRANSFORM CONFIG =============================================================
# For computing transforms between Robot and RMF coordinate systems
# Add 4 points which are in rmf map and the robot map (Robot map with publish point in rviz and in rmf with set vertex) 
# TODO Claculate Reference Coordinates per Map 
# e.g. Level1:
#           rmf: ...
#           robot: ...
#      Level2:
reference_coordinates:
  rmf: [[5.1310, -10.9159],
        [17.2542, -8.2498],
        [9.0044, -6.6401],
        [11.1674, -6.9922]]
  robot: [[-11.394, -6.044],
        [0.6766, -3.357],
        [-7.529, -1.788],
        [-5.389, -2.124]]
